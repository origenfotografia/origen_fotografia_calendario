<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origen Fotografía | Calendario Disponibilidad</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #0a0a0a; color: #f4f4f5; }
        
        /* Estados de disponibilidad */
        .state-default { background-color: rgba(39, 39, 42, 0.3); color: #a1a1aa; }
        .state-available { background-color: rgba(16, 185, 129, 0.2); color: #34d399; box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.5); }
        .state-reserved { background-color: rgba(245, 158, 11, 0.2); color: #fbbf24; box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.5); }
        .state-busy { background-color: rgba(244, 63, 94, 0.2); color: #fb7185; box-shadow: 0 0 0 1px rgba(244, 63, 94, 0.5); }
        
        /* Indicador de día actual */
        .is-today::after { content: ''; position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background-color: currentColor; opacity: 0.5; }
    </style>
</head>
<body class="font-sans selection:bg-zinc-800 min-h-screen flex flex-col">
    <div class="max-w-md mx-auto px-4 py-2 sm:py-12 flex flex-col min-h-screen w-full">
        
        <header class="text-center flex flex-col items-center">
            <img 
                src="logo.svg" 
                alt="Origen Fotografía" 
                class="h-24 sm:h-28 object-contain opacity-90"
                referrerpolicy="no-referrer"
            >
        </header>

        <main class="flex-grow">
            <div class="bg-zinc-900/50 border border-zinc-800/50 rounded-3xl p-6 backdrop-blur-sm shadow-2xl">
                
                <div class="flex items-center justify-between mb-8">
                    <button onclick="changeMonth(-1)" class="p-2 rounded-full hover:bg-zinc-800 transition-colors text-zinc-400 hover:text-zinc-100">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <h2 class="font-serif text-xl font-medium capitalize" id="month-year-display">
                        </h2>
                    <button onclick="changeMonth(1)" class="p-2 rounded-full hover:bg-zinc-800 transition-colors text-zinc-400 hover:text-zinc-100">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </div>

                <div class="grid grid-cols-7 gap-1 mb-4 text-center text-xs font-medium text-zinc-500">
                    <div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div>
                </div>

                <div id="calendar-grid" class="grid grid-cols-7 gap-1 sm:gap-2 justify-items-center">
                    </div>
            </div>

            <div class="mt-4 space-y-3 px-4">
                <div class="flex items-center gap-3">
                    <div class="w-3 h-3 rounded-full bg-amber-500/50 ring-1 ring-amber-500/50"></div>
                    <span class="text-sm text-zinc-300">Reservado / En negociación</span>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-3 h-3 rounded-full bg-rose-500/50 ring-1 ring-rose-500/50"></div>
                    <span class="text-sm text-zinc-300">Ocupado / No disponible</span>
                </div>
            </div>
            
            <div class="mt-4 text-center flex flex-col items-center gap-5">
                <a href="https://www.bodas.net/fotografos/origen-fotografia--e181414" target="_blank" class="inline-block bg-zinc-100 text-zinc-900 font-medium px-8 py-3 rounded-full hover:bg-white transition-colors shadow-lg">
                    Solicitar Reserva
                </a>

                <a href="https://www.instagram.com/origen_fotografia/" target="_blank" class="flex items-center gap-2 text-zinc-400 hover:text-white transition-colors group">
                    <svg class="w-5 h-5 opacity-80 group-hover:opacity-100 transition-opacity" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill-rule="evenodd" d="M12.315 2c2.43 0 2.784.013 3.808.06 1.064.049 1.791.218 2.427.465a4.902 4.902 0 011.772 1.153 4.902 4.902 0 011.153 1.772c.247.636.416 1.363.465 2.427.048 1.067.06 1.407.06 4.123v.08c0 2.643-.012 2.987-.06 4.043-.049 1.064-.218 1.791-.465 2.427a4.902 4.902 0 01-1.153 1.772 4.902 4.902 0 01-1.772 1.153c-.636.247-1.363.416-2.427.465-1.067.048-1.407.06-4.123.06h-.08c-2.643 0-2.987-.012-4.043-.06-1.064-.049-1.791-.218-2.427-.465a4.902 4.902 0 01-1.772-1.153 4.902 4.902 0 01-1.153-1.772c-.247-.636-.416-1.363-.465-2.427-.047-1.024-.06-1.379-.06-3.808v-.63c0-2.43.013-2.784.06-3.808.049-1.064.218-1.791.465-2.427a4.902 4.902 0 011.153-1.772A4.902 4.902 0 015.45 2.525c.636-.247 1.363-.416 2.427-.465C8.901 2.013 9.256 2 11.685 2h.63zm-.081 1.802h-.468c-2.456 0-2.784.011-3.807.058-.975.045-1.504.207-1.857.344-.467.182-.8.398-1.15.748-.35.35-.566.683-.748 1.15-.137.353-.3.882-.344 1.857-.047 1.023-.058 1.351-.058 3.807v.468c0 2.456.011 2.784.058 3.807.045.975.207 1.504.344 1.857.182.466.399.8.748 1.15.35.35.683.566 1.15.748.353.137.882.3 1.857.344 1.054.048 1.37.058 4.041.058h.08c2.597 0 2.917-.01 3.96-.058.976-.045 1.505-.207 1.858-.344.466-.182.8-.398 1.15-.748.35-.35.566-.683.748-1.15.137-.353.3-.882.344-1.857.048-1.055.058-1.37.058-4.041v-.08c0-2.597-.01-2.917-.058-3.96-.045-.976-.207-1.505-.344-1.858a3.097 3.097 0 00-.748-1.15 3.098 3.098 0 00-1.15-.748c-.353-.137-.882-.3-1.857-.344-1.023-.047-1.351-.058-3.807-.058zM12 6.865a5.135 5.135 0 100 10.27 5.135 5.135 0 000-10.27zm0 1.802a3.333 3.333 0 110 6.666 3.333 3.333 0 010-6.666zm5.338-3.205a1.2 1.2 0 110 2.4 1.2 1.2 0 010-2.4z" clip-rule="evenodd" />
                    </svg>
                    <span class="text-sm font-medium">@origen_fotografia</span>
                </a>
            </div>
        </main>
    </div>

    <script>
        // =================================================================
        // 📸 ZONA DE EDICIÓN DEL FOTÓGRAFO 📸
        // =================================================================
        // Añade aquí las fechas con su estado. 
        // Formato: "AÑO-MES-DIA": "estado"
        // Estados posibles: "available" (verde), "reserved" (amarillo), "busy" (rojo)
        
        const MIS_FECHAS = {
            "16-04-2026": "reserved",
	        "17-04-2026": "reserved",
            "20-04-2026": "busy",
            "21-04-2026": "busy",
	        "21-04-2026": "busy",
	        "22-04-2026": "busy",
	        "23-04-2026": "busy",
	        "24-04-2026": "busy",
	        "25-04-2026": "busy",
	        "26-04-2026": "busy"
        };
        // =================================================================

        let currentDate = new Date();
        const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

        document.addEventListener('DOMContentLoaded', () => {
            renderCalendar();
        });

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('month-year-display').innerHTML = `${monthNames[month]} <span class="text-zinc-500 font-sans text-lg">${year}</span>`;

            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let firstDay = new Date(year, month, 1).getDay();
            firstDay = firstDay === 0 ? 6 : firstDay - 1; 

            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            for (let i = 0; i < firstDay; i++) {
                const empty = document.createElement('div');
                empty.className = 'h-10 w-10 sm:h-12 sm:w-12';
                grid.appendChild(empty);
            }
			
			const today = new Date();
            const todayStr = `${String(today.getDate()).padStart(2, '0')}-${String(today.getMonth() + 1).padStart(2, '0')}-${today.getFullYear()}`;

            for (let i = 1; i <= daysInMonth; i++) {
                const dateStr = `${String(i).padStart(2, '0')}-${String(month + 1).padStart(2, '0')}-${year}`;
                const state = MIS_FECHAS[dateStr] || 'default';
                
                const div = document.createElement('div');
                div.className = `relative flex items-center justify-center h-10 w-10 sm:h-12 sm:w-12 rounded-full text-sm font-medium state-${state} ${dateStr === todayStr && state === 'default' ? 'ring-1 ring-zinc-500' : ''} ${dateStr === todayStr ? 'is-today' : ''}`;
                
                div.innerText = i;
                grid.appendChild(div);
            }
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }
    </script>
</body>
</html>
